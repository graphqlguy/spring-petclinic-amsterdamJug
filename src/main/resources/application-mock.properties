# Mock mode: the public services are answered by a server inside the application, with answers
# recorded from the live services. Start it with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mock
# The recordings are in src/main/resources/mock-upstreams
petclinic.mock.port=9091
petclinic.mock.url=http://localhost:${petclinic.mock.port}

spring.http.serviceclient.rasff.base-url=${petclinic.mock.url}/rasff/rasff-window/backend/public
petclinic.upstream.gbif.url=${petclinic.mock.url}/gbif
spring.http.serviceclient.cbs.base-url=${petclinic.mock.url}/cbs
spring.http.serviceclient.naturalis.base-url=${petclinic.mock.url}/naturalis
spring.http.serviceclient.luchtmeetnet.base-url=${petclinic.mock.url}/luchtmeetnet
spring.http.serviceclient.openfda.base-url=${petclinic.mock.url}/openfda
spring.http.serviceclient.inaturalist.base-url=${petclinic.mock.url}/inaturalist
spring.http.serviceclient.amsterdam-signals.base-url=${petclinic.mock.url}/amsterdam-signals
spring.http.serviceclient.eu-feed-additives.base-url=${petclinic.mock.url}/eu-feed-additives
petclinic.upstream.europepmc.url=${petclinic.mock.url}/europepmc/europepmc/webservices/soap
# The newest recorded answers are from this moment. The assistant uses it as today,
# so a question about today finds the recorded answers on any later day.
petclinic.now=2026-11-15T17:00:00Z
