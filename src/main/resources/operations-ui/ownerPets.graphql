# The owner page for a schema in which owners have their pets and the pets have yet to get their visits.
query OwnerPets($id: ID!) {
  owner(id: $id) {
    id
    firstName
    lastName
    address
    city
    telephone
    pets {
      id
      name
      birthDate
      type {
        id
        name
      }
    }
  }
}
