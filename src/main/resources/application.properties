# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# GraphQL
spring.graphql.graphiql.enabled=true

# MCP
# GATool serves the three dynamic tools below alone at /mcp: this folder does not exist, so GATool
# skips the operation files, which the frontend still sends from operations/
gatool.mcp.operations.locations=optional:classpath*:none/
# An MCP client connects without signing in, which suits a laptop. A deployed server secures /mcp.
gatool.mcp.security.unsafe.allow-mcp-calls-without-authentication=true

# Dynamic tools
# Three tools, with which the model writes its own GraphQL: searchSchema, introspectType
# and executeGraphql. MCP clients and the assistant both get them.
gatool.dev.experimental.generate-tools=dynamic-three-step
# searchSchema ranks the schema's fields by meaning, with the embedding model that the README pulls
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder
# Tokens of search results one searchSchema call returns. The GBIF occurrence search alone
# costs 1,105 tokens, for its 151 arguments.
gatool.dev.experimental.dynamic-operations.search-token-budget=5000
# The embedding model reads a question as "Instruct: <task>\nQuery:<question>", the format
# Qwen3 embedding models are trained with. Schema fields are embedded without an instruction.
gatool.dev.experimental.dynamic-operations.question-prefix=Instruct: Given a question, retrieve the GraphQL schema field that answers it\nQuery:

# Chat
# The assistant in the frontend gets the same three tools, inside the application
gatool.in-process.operations.locations=optional:classpath*:none/
# The chat model in Ollama. With less memory, or to see how a smaller model does, switch the two
# model lines below: qwen3:8b is 5.2 GB, pulled with: ollama pull qwen3:8b
#spring.ai.ollama.chat.model=qwen3:8b
# The default is 17 GB and takes about 16 GB of memory while it runs, pulled with: ollama pull qwen3.6:27b
spring.ai.ollama.chat.model=qwen3.6:27b
# The model reasons before it writes a query or an answer, which takes longer
spring.ai.ollama.chat.think=true
# The model reads the tools, the question and the tool results within this many tokens.
# Ollama picks a size from your memory when this is unset, so set it for the same result on every laptop.
# One schema search returns up to 5,000 tokens here and a question takes several tool calls, so this
# is twice the 8,192 that the smaller schema needs. A model that runs out of room loses the question.
spring.ai.ollama.chat.num-ctx=16384
# One call to the model, so the chat reports at once when Ollama is not running. By default
# Spring AI tries a failed call 10 more times, with pauses that grow to 3 minutes.
spring.ai.retry.max-attempts=0
# The calls to the model go through the JDK's HTTP client. Reactor Netty, which Spring AI also
# brings, logs an ERROR about DNS on macOS at its first call.
spring.http.clients.imperative.factory=jdk
# Logs the name of each tool the model calls
logging.level.org.springframework.ai.model.tool=DEBUG

# The MCP server, as clients list it
spring.ai.mcp.server.name=petclinic
# What the model of an MCP client reads when it connects. This text replaces GATool's, so it names
# the topics of the API and then says how to use the three tools.
spring.ai.mcp.server.instructions=This server answers questions about a veterinary clinic in Amsterdam, the Netherlands, \
  and about public data on animals and pets. \
  The API holds the clinic's owners, their pets and visits, and its vets. It also reads public services: \
  the reports of Amsterdam residents about public space, such as loose dogs (Signalen Amsterdam); \
  Dutch statistics on pet prices and farm animals (CBS); the air quality of the Netherlands (Luchtmeetnet); \
  EU alerts about food and pet food safety (RASFF); the EU register of feed additives; \
  adverse reactions to veterinary medicines (openFDA); veterinary research papers (Europe PMC); \
  and the names, classification, museum specimens and sightings of species (GBIF, Naturalis and iNaturalist). \
  For a question on any of these topics, search the schema before you decide the API cannot answer it. \
  Find the fields with searchSchema, use introspectType if you need more details about a type, and run the query \
  with executeGraphql. When an answer comes from a public service, name the service.

# Public services
# The schema also reads public services of Amsterdam, the Netherlands, the EU and others. These are the
# live URLs; the "mock" profile points them at answers recorded from the services, see application-mock.properties.
petclinic.upstream.connect-timeout=10s
petclinic.upstream.read-timeout=10s
# Several services ask callers to name their application
petclinic.upstream.user-agent=spring-petclinic-amsterdamjug (https://github.com/graphqlguy/spring-petclinic-amsterdamJug)
# A service written by hand is an HTTP interface in a group of its own. Spring Boot reads the
# base URL and the timeouts of a group from spring.http.serviceclient.<group>.*

# RASFF Window: the notifications of the EU's Rapid Alert System for Food and Feed
spring.http.serviceclient.rasff.base-url=https://webgate.ec.europa.eu/rasff-window/backend/public
spring.http.serviceclient.rasff.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.rasff.read-timeout=${petclinic.upstream.read-timeout}

# Statistics Netherlands (CBS), an OData service. The paths of its catalogue and of its tables start from this URL
spring.http.serviceclient.cbs.base-url=https://opendata.cbs.nl
spring.http.serviceclient.cbs.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.cbs.read-timeout=${petclinic.upstream.read-timeout}

# Naturalis Biodiversity Center: species and museum specimens
spring.http.serviceclient.naturalis.base-url=https://api.biodiversitydata.nl
spring.http.serviceclient.naturalis.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.naturalis.read-timeout=${petclinic.upstream.read-timeout}

# Luchtmeetnet: the air quality of the Netherlands
spring.http.serviceclient.luchtmeetnet.base-url=https://api.luchtmeetnet.nl
spring.http.serviceclient.luchtmeetnet.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.luchtmeetnet.read-timeout=${petclinic.upstream.read-timeout}

# openFDA: adverse reactions to veterinary medicines
spring.http.serviceclient.openfda.base-url=https://api.fda.gov
spring.http.serviceclient.openfda.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.openfda.read-timeout=${petclinic.upstream.read-timeout}

# iNaturalist: the animals seen in a place
spring.http.serviceclient.inaturalist.base-url=https://api.inaturalist.org
spring.http.serviceclient.inaturalist.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.inaturalist.read-timeout=${petclinic.upstream.read-timeout}

# Signalen Amsterdam: the reports of Amsterdam residents about public space
spring.http.serviceclient.amsterdam-signals.base-url=https://api.meldingen.amsterdam.nl
spring.http.serviceclient.amsterdam-signals.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.amsterdam-signals.read-timeout=${petclinic.upstream.read-timeout}

# The EU register of feed additives
spring.http.serviceclient.eu-feed-additives.base-url=https://api.datalake.sante.service.ec.europa.eu
spring.http.serviceclient.eu-feed-additives.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.eu-feed-additives.read-timeout=${petclinic.upstream.read-timeout}

# Europe PMC, a SOAP service, called with the client of Spring Web Services: veterinary research papers.
# Petclinic serves its own API over GraphQL only, so the server side of Spring Web Services,
# a MessageDispatcherServlet at /services, stays off.
petclinic.upstream.europepmc.url=https://www.ebi.ac.uk/europepmc/webservices/soap
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration

# GBIF, the Global Biodiversity Information Facility. It has more than 200 read operations, so one
# fetcher serves them all from an operation table (gbif/operations.json)
petclinic.upstream.gbif.url=https://api.gbif.org

# JPA
spring.jpa.hibernate.ddl-auto=none
# GraphQL reads lazy relationships, such as the pets of an owner, while it builds the
# response, so the persistence context stays open until the request ends
spring.jpa.open-in-view=true
# Logs every SQL statement. Turn it on to count the statements of a query.
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Demo
# Pauses every service call for this long, so that each database round trip shows in the
# response time. Set it to 1s to show the N+1 problem.
petclinic.demo.latency=0s

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
